name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

# Verifica (não corrige): falha se o código não estiver formatado, tiver erros de tipos ou não passar a análise estática
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate

      - name: Formatação do PHP (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática do PHP (Larastan)
        run: composer analisar

      - name: Formatação do frontend (Prettier)
        run: npm run format:check

      - name: Regras do frontend (ESLint)
        run: npx eslint .

      - name: Tipos do frontend (TypeScript)
        run: npx tsc --noEmit
